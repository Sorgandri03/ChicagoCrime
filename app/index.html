<!DOCTYPE html>
<meta charset="utf-8">

<head>
    <title>D3 test page</title>

    <link rel="stylesheet" href="/app/style.css">

    <!-- Load d3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <style>
            html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
            .container { height: 100vh; max-height: 100vh; padding: 0; margin: 0; width: 100%; max-width: 100%; box-sizing: border-box; }
            .graph-row { height: 50vh; margin-bottom: 0 !important; }
            /* remove bootstrap gutters and padding to maximize space */
            .row { --bs-gutter-x: 0; margin-left: 0; margin-right: 0; }
            .col-md-6 { padding: 0; }
            /* ensure inner graph divs fill their column */
            .col-md-6 > div { width: 100%; height: 100%; }
            #bargraph, #map, #stackedarea, #scatteredplot { width: 100%; height: 100%; }
        </style>
</head>

<body>
    <div class="container">
        <div class="row mb-0 graph-row">
            <div class="col-md-8">
                <div id="bargraph" class="h-100"></div>
            </div>
            <div class="col-md-4">
                <div id="map" class="h-100"></div>
            </div>
        </div>
        <div class="row mb-0 graph-row">
            <div class="col-md-8">
                <div id="stackedarea" class="h-100"></div>
            </div>
            <div class="col-md-4">
                <div id="scatteredplot" class="h-100"></div>
            </div>
        </div>
    </div>

    <script src="/app/graphs/bargraph.js"></script>
    <script src="/app/graphs/map.js"></script>
    <script src="/app/graphs/stackedarea.js"></script>
    <script src="/app/graphs/scatteredplot.js"></script>
</body>
